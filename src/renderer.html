<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WiFi Telegram Checker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      height: calc(100vh - 40px);
      overflow-y: auto;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .status-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      border: 2px solid #e9ecef;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6c757d;
    }

    .status-dot.connected {
      background: #28a745;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-weight: 600;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .info-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔔 WiFi Telegram Checker</h1>
    <p class="subtitle">Tự động gửi thông báo khi kết nối đến WiFi</p>

    <div class="status-box">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Chưa bắt đầu kiểm tra</span>
      </div>
      <div id="statusMessage" style="font-size: 13px; color: #666; margin-top: 8px;"></div>
    </div>

    <div class="form-group">
      <label for="wifiSSID">Tên WiFi (SSID):</label>
      <input type="text" id="wifiSSID" placeholder="VD: MyHomeWiFi">
      <div class="info-text">Nhập chính xác tên WiFi bạn muốn theo dõi</div>
    </div>

    <div class="form-group">
      <label for="botToken">Telegram Bot Token:</label>
      <input type="text" id="botToken" placeholder="VD: 123456789:ABCdefGHIjklMNOpqrsTUVwxyz">
      <div class="info-text">Lấy từ @BotFather trên Telegram</div>
    </div>

    <div class="form-group">
      <label for="chatId">Telegram Chat ID:</label>
      <input type="text" id="chatId" placeholder="VD: 123456789">
      <div class="info-text">Lấy từ @userinfobot hoặc @getidsbot</div>
    </div>

    <div class="form-group">
      <label for="checkInterval">Khoảng thời gian kiểm tra (giây):</label>
      <input type="number" id="checkInterval" value="30" min="5">
      <div class="info-text">Thời gian giữa các lần kiểm tra (tối thiểu 5 giây)</div>
    </div>

    <div class="button-group">
      <button class="btn-success" id="saveBtn">💾 Lưu cấu hình</button>
      <button class="btn-secondary" id="testBtn">🔔 Test Telegram</button>
    </div>

    <div class="button-group">
      <button class="btn-primary" id="startBtn">▶️ Bắt đầu</button>
      <button class="btn-danger" id="stopBtn" disabled>⏸️ Dừng lại</button>
    </div>

    <div id="messageBox"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
